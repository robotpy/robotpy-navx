      GetAlgoStates:
      EnableOptionalMessages:
      GetQuat6D:
      GetQuat9D:
      GetAngularVel:
      GetLinearAccel:
      GetCompass:
      SelfTest:
      SetODRHz:
      GetSensorUUID:
      GetTemperature:
      GetRotation2D:
      GetRotation3D:
      ResetYaw:
      GetAngle:
      Enable9DYaw:
    enums:
