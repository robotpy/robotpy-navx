[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
    "hatch-vcs",
    "semiwrap~=0.8.1",
    "hatch-meson~=0.1.0",
    "hatch-robotpy~=0.2.1",
    "wpilib~=2027.0.0a8",
]


[project]
name = "robotpy-navx"
dynamic = ["version"]
description = "Python wrapper for Studica NavX sensor"
license = "BSD-3-Clause"
dependencies = [
    "wpilib>=2027.0.0a8,<2028",
]

[[project.authors]]
name = "RobotPy Development Team"
email = "robotpy@googlegroups.com"

[project.urls]
"Source code" = "https://github.com/robotpy/robotpy-navx"


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "navx/version.py"

[tool.hatch.build.targets.wheel]
packages = ["navx"]


[[tool.hatch.build.hooks.robotpy.maven_lib_download]]
artifact_id = "StudicaLib-cpp"
group_id = "com.studica.frc"
repo_url = "https://dev.studica.com/maven/release/2027"
version = "2027.0.0-alpha-1"
staticlibs = ["StudicaLib"]
extract_to = "lib"

[[tool.hatch.build.hooks.robotpy.maven_lib_download]]
artifact_id = "StudicaLib-driver"
group_id = "com.studica.frc"
repo_url = "https://dev.studica.com/maven/release/2027"
version = "2027.0.0-alpha-1"
staticlibs = ["StudicaLibDriver"]
extract_to = "lib"


[tool.hatch.build.hooks.semiwrap]

[tool.hatch.build.hooks.meson]


[tool.semiwrap]
update_init = ["navx"]
scan_headers_ignore = ["*"]


[tool.semiwrap.extension_modules."navx._navx"]
name = "navx"

depends = [
    "wpilib",
]

includes = [
    "lib/include"
]

[tool.semiwrap.extension_modules."navx._navx".headers]
CanBus = "studica/CanBus.hpp"
FirmwareVersion = "studica/FirmwareVersion.hpp"
NavX = "studica/Navx.hpp"
Status = "studica/Status.hpp"
UsbPort = "studica/UsbPort.hpp"
